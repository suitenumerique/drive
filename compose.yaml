name: lasuite

include:
  - interop/compose.yml

services:
  drive-postgresql:
    image: postgres:16
    user: ${DOCKER_USER:-1000}
    networks:
      - lasuite
    ports:
      - "8201:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 1s
      timeout: 2s
      retries: 300
    env_file:
      - env.d/development/postgresql
      - env.d/development/postgresql.${ENV_OVERRIDE:-local}
    volumes:
      - ./data/postgresql.${ENV_OVERRIDE:-local}:/var/lib/postgresql/data

  createbuckets:
    image: minio/mc
    networks:
      - lasuite
    depends_on:
      minio:
        condition: service_healthy
        restart: true
    entrypoint: >
      sh -c "
      /usr/bin/mc alias set drive http://minio:9000 lasuite password && \
      /usr/bin/mc mb drive/drive-media-storage && \
      /usr/bin/mc version enable drive/drive-media-storage && \
      exit 0;"

  drive-backend:
    build:
      context: .
      target: backend-development
      args:
        DOCKER_USER: ${DOCKER_USER:-1000}
    user: ${DOCKER_USER:-1000}
    image: drive:backend-development
    environment:
      - PYLINTHOME=/app/.pylint.d
      - DJANGO_CONFIGURATION=Development
    env_file:
      - env.d/development/common
      - env.d/development/common.${ENV_OVERRIDE:-local}
      - env.d/development/postgresql
      - env.d/development/postgresql.${ENV_OVERRIDE:-local}
    ports:
      - "8200:8000"
    volumes:
      - ./src/backend:/app
      - ./data/static:/data/static
      - /app/.venv
    networks:
      - lasuite
    depends_on:
      drive-postgresql:
        condition: service_healthy
        restart: true
      mailcatcher:
        condition: service_started
      redis:
        condition: service_started
      createbuckets:
        condition: service_started
      drive-celery:
        condition: service_started
      collabora:
        condition: service_healthy
      onlyoffice:
        condition: service_healthy

  ds-proxy:
    image: demarchenumerique/ds-proxy:v2.0.0-alpha.4
    command:
      [
        "proxy",
        "--address",
        "0.0.0.0:4444",
        "--password-file",
        "/etc/dsproxy/PASSWORD",
        "--keyring-file",
        "/etc/dsproxy/keyring.toml",
        "--upstream-url",
        "http://minio:9000",
        "--local-encryption-directory",
        "/var/tmp/local_encryption/",
        "--s3-access-key",
        "drive",
        "--s3-secret-key",
        "password",
        "--s3-region",
        "us-east-1",
      ]
    networks:
      - lasuite
    ports:
      - "8204:4444"
    environment:
      - RUST_LOG=debug,ds_proxy::http::handlers::fetch=trace,ds_proxy::http::handlers::forward=trace
      - RUST_BACKTRACE=full
    volumes:
      - ./docker/files/development/ds_proxy/:/etc/dsproxy/:ro

  drive-celery:
    user: ${DOCKER_USER:-1000}
    image: drive:backend-development
    networks:
      - lasuite
    command: ["celery", "-A", "drive.celery_app", "worker", "-l", "DEBUG"]
    environment:
      - DJANGO_CONFIGURATION=Development
    env_file:
      - env.d/development/common
      - env.d/development/common.local
      - env.d/development/common.${ENV_OVERRIDE:-local}
      - env.d/development/postgresql
      - env.d/development/postgresql.local
      - env.d/development/postgresql.${ENV_OVERRIDE:-local}
    volumes:
      - ./src/backend:/app
      - ./data/static:/data/static
      - /app/.venv

  drive-nginx:
    image: nginx:1.25
    networks:
      - lasuite
    ports:
      - "8202:8083"
    volumes:
      - ./docker/files/development/etc/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - keycloak
      - drive-backend 

  drive-frontend:
    user: "${DOCKER_USER:-1000}"
    build:
      context: .
      dockerfile: ./src/frontend/Dockerfile
      target: drive-dev
      args:
        API_ORIGIN: "http://drive.lasuite.localhost:8200"
    image: drive:frontend-development
    volumes:
      - ./src/frontend/:/home/frontend/
      - /home/frontend/node_modules
      - /home/frontend/apps/drive/node_modules
    networks:
      - lasuite
    ports:
      - "8203:3000"

  drive-node:
    image: node:22
    user: "${DOCKER_USER:-1000}"
    environment:
      HOME: /tmp
    volumes:
      - ".:/app"

  collabora:
    image: collabora/code:26.04.2.2.1
    # The entrypoint runs coolwsd directly (no shell in the image), so
    # options are passed as command arguments instead of extra_params.
    command: ["--o:ssl.enable=false"]
    healthcheck:
      # The built-in probe targets https; pass the same override so it
      # checks the plain-http endpoint we actually serve.
      test: ["CMD", "/usr/bin/coolwsd", "--probe", "--o:ssl.enable=false"]
      interval: 30s
      retries: 5
      start_period: 60s
      timeout: 10s
    ports:
      - "8205:9980"
    networks:
      - lasuite
    environment:
      - username=drive
      - password=password
      - server_name=drive.lasuite.localhost:8205
      - aliasgroup1=app-dev:8000

  onlyoffice:
    image: onlyoffice/documentserver-de
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/hosting/discovery"]
      interval: 30s
      retries: 5
      start_period: 60s
      timeout: 10s
    environment:
      TZ: "Europe/Berlin"
      USE_UNAUTHORIZED_STORAGE: "true"
      JWT_ENABLED: "true"
      JWT_SECRET: "ThisIsNotASecretKeyDev"
    ports:
      - "8206:80"
    networks:
      - lasuite
    volumes:
      - ./docker/onlyoffice/local-development.json:/etc/onlyoffice/documentserver/local-production-linux.json
      # Enable debug
      - ./docker/onlyoffice/log4js/production.json:/etc/onlyoffice/documentserver/log4js/production.json
