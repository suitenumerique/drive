# Dex configuration for the local development stack (compose.yaml).
#
# Dex is a lightweight OpenID Connect provider that replaces Keycloak (and its
# dedicated PostgreSQL database) in development. It runs entirely in memory:
# users and the "drive" client are declared statically below, nothing is
# persisted between restarts.
#
# It is reachable through the nginx service, so the issuer is served from
# http://localhost:8083/dex (see docker/files/development/etc/nginx/conf.d).
#
# Do not use this configuration in production.

issuer: http://localhost:8083/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

frontend:
  issuer: Drive (dev)
  theme: light

logger:
  level: info
  format: text

oauth2:
  responseTypes: ["code"]
  # Do not ask users to approve the "drive" client on every login.
  skipApprovalScreen: true
  alwaysShowLoginScreen: false
  passwordConnector: local

expiry:
  idTokens: "24h"

# The Drive backend (Django, mozilla-django-oidc) client.
#
# Dex only accepts exact redirect URIs (no wildcards): add one entry per origin
# the backend may be reached from (see docs/setup-local-network.md).
staticClients:
  - id: drive
    name: Drive
    secret: ThisIsAnExampleKeyForDevPurposeOnly
    redirectURIs:
      - http://localhost:8071/api/v1.0/callback/

# Built-in username/password database.
#
# Login is done with the *email* address. Passwords are bcrypt hashes
# (cost >= 10), e.g.:
#   python3 -c 'import bcrypt; print(bcrypt.hashpw(b"pass", bcrypt.gensalt(10)).decode())'
#
# `name` is exposed as the OIDC "name" claim and `preferredUsername` as
# "preferred_username"; the backend maps them to full_name / short_name
# (see OIDC_USERINFO_* in env.d/development/common).
enablePasswordDB: true
staticPasswords:
  # drive@drive.world / drive
  - email: drive@drive.world
    hash: "$2b$10$Sz1K3YLWsO4qyO24tM6AgOVhY5dUcHbIpv99WA0vzm2Fl5vt.csmu"
    username: drive
    name: John Doe
    preferredUsername: John
    userID: 1e5a0cc4-2a55-4f2b-8e2f-0c2b9f3f6c01
  # paige.turner@library.book / pass
  - email: paige.turner@library.book
