# The variable host in proxy_pass lets nginx refresh MinIO's IP through DNS,
# but also disables automatic location-prefix replacement in the upstream URI.
# Build the full storage URI here so the item's path and filename are retained.
# Use $request_uri to preserve escaped filenames and query strings.
map $request_uri $media_storage_uri {
    ~^/media/(?:preview/)?(.*)$ /drive-media-storage/$1;
    default "";
}

server {
    listen 8083;
    server_name localhost;
    charset utf-8;

    # Refresh Docker service addresses after containers are recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $media_storage_host minio:9000;

    # Proxy auth for media
    location /media/ {
        # Auth request configuration
        auth_request /media-auth;
        auth_request_set $authHeader $upstream_http_authorization;
        auth_request_set $authDate $upstream_http_x_amz_date;
        auth_request_set $authContentSha256 $upstream_http_x_amz_content_sha256;

        # Pass specific headers from the auth response
        proxy_set_header Authorization $authHeader;
        proxy_set_header X-Amz-Date $authDate;
        proxy_set_header X-Amz-Content-SHA256 $authContentSha256;

        # Get resource from Minio
        proxy_pass http://$media_storage_host$media_storage_uri;
        proxy_set_header Host minio:9000;
        # To use with ds_proxy
        # set $media_storage_host ds-proxy:4444;
        # proxy_pass http://$media_storage_host/upstream$media_storage_uri;
        # proxy_set_header Host ds-proxy:4444;
        add_header Content-Disposition "attachment";
        add_header X-Robots-Tag noindex always;
    }

    # Proxy auth for media
    location /media/preview/ {
        # Auth request configuration
        auth_request /media-auth;
        auth_request_set $authHeader $upstream_http_authorization;
        auth_request_set $authDate $upstream_http_x_amz_date;
        auth_request_set $authContentSha256 $upstream_http_x_amz_content_sha256;

        # Pass specific headers from the auth response
        proxy_set_header Authorization $authHeader;
        proxy_set_header X-Amz-Date $authDate;
        proxy_set_header X-Amz-Content-SHA256 $authContentSha256;

        # Get resource from Minio
        proxy_pass http://$media_storage_host$media_storage_uri;
        proxy_set_header Host minio:9000;
        # To use with ds_proxy
        # set $media_storage_host ds-proxy:4444;
        # proxy_pass http://$media_storage_host/upstream$media_storage_uri;
        # proxy_set_header Host ds-proxy:4444;
        add_header X-Robots-Tag noindex always;
    }

    location /media-auth {
        proxy_pass http://app-dev:8000/api/v1.0/items/media-auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Original-URL $request_uri;
        
        # Prevent the body from being passed
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-Method $request_method;
    }

    location / {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
