server {
  listen 8080;
  listen 3000;
  server_name localhost;

  server_tokens off;

  root /usr/share/nginx/html;

  add_header X-Frame-Options DENY always;
  add_header X-Robots-Tag noindex always;

  location / {
    try_files $uri index.html $uri/ =404;
  }

  # The editor of encrypted documents runs on the sandbox's own origin only
  # (the server below): never with Drive's.
  location ^~ /onlyoffice/ {
    return 404;
  }

  location ^~ /onlyoffice-sandbox/ {
    return 404;
  }

  location ~ "^/explorer/items/files/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/?$" {
      try_files $uri /explorer/items/files/[id].html;
  }

  location ~ "^/explorer/items/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/?$" {
    try_files $uri /explorer/items/[id].html;
  }

  location ~ "^/wopi/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/?$" {
    try_files $uri /wopi/[id].html;
  }

  location ~ "^/user-reconciliations/(active|inactive)/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/?$" {
    try_files $uri /user-reconciliations/$1/[id].html;
  }

  location ~ "^/explorer/items/(favorites|my-files|recent|shared-with-me)/?$" {
    try_files $uri /explorer/items/$1.html;
  }

  location ~ "^/sdk/explorer/?$" {
      try_files $uri /sdk/explorer.html;
  }

  location ~ "^/sdk/?$" {
      try_files $uri /sdk.html;
  }

  location ~ "^/explorer/trash/?$" {
    try_files $uri /explorer/trash.html;
  }

  location ~ "^/401/?$" {
    try_files $uri /401.html;
  }

  location ~ "^/403/?$" {
    try_files $uri /403.html;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  # Without this, the .mjs file is served as application/octet-stream 
  # which breaks ES modules
  location ~* \.mjs$ {
      types { application/javascript mjs; }
      try_files $uri =404;
  }
}

# The OnlyOffice sandbox: OnlyOffice and x2t for encrypted documents, on their own
# origin (route a dedicated host to this port, see ENCRYPTION_ONLYOFFICE_SANDBOX_URL).
# Static files only, no cookies: a document exploiting a flaw of the editor
# finds no session and no key here, and the policy keeps every request on this
# origin. Locations set their caching with `expires`, not `add_header`, which
# would drop the headers below.
server {
  listen 8081;
  server_name localhost;

  server_tokens off;
  access_log off;

  root /usr/share/nginx/html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; frame-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'none'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), display-capture=()" always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Robots-Tag noindex always;

  location /onlyoffice-sandbox/ {
    # Small and changed by every release: always revalidated.
    expires -1;
    try_files $uri =404;
  }

  location /onlyoffice/ {
    # Pinned releases whose ETags survive rebuilds (see the Dockerfile): a day without
    # asking, then a revalidation that answers 304.
    expires 1d;
    gzip_static on;
    try_files $uri =404;
  }

  location / {
    return 404;
  }
}
