name: Frontend Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

permissions:
  contents: read

jobs:
  install-front:
    uses: ./.github/workflows/front-dependencies-installation.yml
    with:
      node_version: "22.x"

  build-mails:
    uses: ./.github/workflows/build-mails.yml

  lint-front:
    runs-on: ubuntu-latest
    needs: install-front
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Restore the frontend cache
        uses: actions/cache@v4
        with:
          path: "src/frontend/**/node_modules"
          key: front-node_modules-${{ hashFiles('src/frontend/**/yarn.lock') }}
          fail-on-cache-miss: true

      - name: Check linting
        run: cd src/frontend/ && yarn lint

  test-unit:
    runs-on: ubuntu-latest
    needs: install-front
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Restore the frontend cache
        uses: actions/cache@v4
        with:
          path: "src/frontend/**/node_modules"
          key: front-node_modules-${{ hashFiles('src/frontend/**/yarn.lock') }}
          fail-on-cache-miss: true

      - name: Run unit tests
        run: |
          cd src/frontend/apps/drive
          yarn test

  build-frontend-e2e:
    runs-on: ubuntu-latest
    needs: install-front
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Restore the frontend cache
        uses: actions/cache@v4
        with:
          path: "src/frontend/**/node_modules"
          key: front-node_modules-${{ hashFiles('src/frontend/**/yarn.lock') }}
          fail-on-cache-miss: true

      - name: Build frontend (static export, .env.development)
        env:
          NEXT_PUBLIC_S3_DOMAIN_REPLACE: http://localhost:9000
          NEXT_PUBLIC_API_ORIGIN: http://localhost:8071
          NEXT_PUBLIC_POSTHOG_TEST_MODE: true
        working-directory: src/frontend/apps/drive
        run: yarn build

      - name: Upload frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: drive-frontend-out
          path: src/frontend/apps/drive/out
          retention-days: 1
          if-no-files-found: error

  test-e2e:
    runs-on: ubuntu-latest
    needs: [install-front, build-mails, build-frontend-e2e]
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - webkit
          - firefox
        shard:
          - "1/3"
          - "2/3"
          - "3/3"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The browsers and their system libraries come from the official
      # Playwright image. Installing those libraries with apt depends on the
      # Ubuntu mirror, which is sometimes slow enough to stall the job for
      # up to an hour. The image tag follows the @playwright/test version so
      # upgrades keep both in sync. The pull runs in the background, during
      # the next steps.
      - name: Start pulling the Playwright image
        run: |
          VERSION=$(jq -r '.devDependencies["@playwright/test"]' src/frontend/apps/e2e/package.json)
          IMAGE="mcr.microsoft.com/playwright:v${VERSION}-noble"
          echo "PLAYWRIGHT_IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          nohup docker pull --quiet "${IMAGE}" > /tmp/playwright-pull.log 2>&1 &

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Restore the frontend cache
        uses: actions/cache@v4
        with:
          path: "src/frontend/**/node_modules"
          key: front-node_modules-${{ hashFiles('src/frontend/**/yarn.lock') }}
          fail-on-cache-miss: true

      - name: Restore the mail templates
        uses: actions/cache@v4
        with:
          path: "src/backend/core/templates/mail"
          key: mail-templates-${{ hashFiles('src/mail/mjml') }}

      - name: Build the drive SDK
        working-directory: src/frontend/packages/sdk
        run: yarn build

      - name: Start sdk-consumer dev server
        working-directory: src/frontend/apps/sdk-consumer
        run: |
          nohup yarn dev > /tmp/sdk-consumer.log 2>&1 &
          echo "sdk-consumer PID $!"

      - name: Download frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: drive-frontend-out
          path: src/frontend/apps/drive/out

      - name: Start Docker services
        run: |
          make bootstrap-e2e run-backend-e2e

      - name: Serve frontend (stock nginx + prod vhost)
        run: make ci-serve-frontend-build

      # Only the browsers run in the container: the tests stay on the runner
      # because they reset the database with make and docker compose. With
      # the host network, localhost in the browsers is the runner's localhost.
      # The server comes from the cached node_modules, mounted read only.
      - name: Start the Playwright browser server
        run: |
          docker run --detach --name playwright-server --init \
            --network host --ipc=host --user pwuser \
            -v "${PWD}:${PWD}:ro" -w "${PWD}/src/frontend/apps/e2e" \
            "${PLAYWRIGHT_IMAGE}" \
            yarn playwright run-server --host 127.0.0.1 --port 53333
          timeout 60 sh -c 'until docker logs playwright-server 2>&1 | grep -q "Listening on"; do sleep 1; done' \
            || { docker logs playwright-server; exit 1; }

      # Playwright reads this variable and connects to the server instead of
      # launching local browsers.
      - name: Run e2e tests
        working-directory: src/frontend/apps/e2e
        env:
          PW_TEST_CONNECT_WS_ENDPOINT: ws://127.0.0.1:53333/
        run: yarn test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}

      - name: Show the Playwright browser server logs
        if: failure()
        run: docker logs playwright-server

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.browser }}-shard-${{ strategy.job-index }}
          path: src/frontend/apps/e2e/report/
          retention-days: 7
