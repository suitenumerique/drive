name: Build mail templates reusable workflow

on:
  workflow_call:
    outputs:
      key:
        description: Cache key of the built mail templates, to restore them
        value: ${{ jobs.build-mails.outputs.key }}

jobs:
  build-mails:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
    defaults:
      run:
        working-directory: src/mail
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Compute the mail templates cache key
        id: key
        run: echo "key=mail-templates-${{ hashFiles('src/mail/mjml/**', 'src/mail/yarn.lock', 'src/mail/bin/**', 'src/mail/html-to-text.config.json') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the mail templates
        uses: actions/cache@v6
        id: mail-templates
        with:
          path: "src/backend/core/templates/mail"
          key: ${{ steps.key.outputs.key }}

      - name: Install yarn
        if: steps.mail-templates.outputs.cache-hit != 'true'
        run: npm install -g yarn

      - name: Install node dependencies
        if: steps.mail-templates.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Build mails
        if: steps.mail-templates.outputs.cache-hit != 'true'
        run: yarn build

      - name: Cache mail templates
        if: steps.mail-templates.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: "src/backend/core/templates/mail"
          key: ${{ steps.key.outputs.key }}
